[project]
name = "pdf-redact"
version = "0.1.0"
description = "Small HTTP service for true PDF redaction on PyMuPDF"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "pymupdf>=1.24",
    "starlette>=0.40",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=10.4",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_redact"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Czech text legitimately contains "ambiguous" characters

[tool.mypy]
python_version = "3.12"
strict = true
# PyMuPDF is only partly annotated; strict would flag every call into it.
disallow_untyped_calls = false
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Starlette's TestClient prefers httpx2; httpx is what the dev group pins.
    "ignore:Using `httpx` with `starlette.testclient`",
]
